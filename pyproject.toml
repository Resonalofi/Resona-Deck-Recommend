[project]
name = "Resona-Deck-Recommend"
version = "0.1.0"
description = "Standalone deck recommend (组卡) calculation service for PJSK"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.35.0",
    "orjson>=3.10.18",
    "aiohttp>=3.10.10",
    "setproctitle>=1.3.7",
    "pydantic==2.11.7",
    "sekai-deck-recommend-cpp>=0.2.5",
    "uvloop>=0.21.0 ; sys_platform != 'win32'",
]
