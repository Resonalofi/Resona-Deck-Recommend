name: Build native release programs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-service-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git -C sekai-deck-recommend-cpp submodule update --init 3rdparty/json

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Configure release candidate
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build release candidate
        run: cmake --build build --parallel 2

      - name: Package Linux release program
        run: |
          mkdir -p package
          cp build/resona-deck-recommend package/
          cp -R build/data package/
          tar -czf resona-deck-recommend-linux-x86_64-${{ github.ref_name }}.tar.gz -C package .

      - name: Upload Linux release program
        uses: actions/upload-artifact@v7
        with:
          name: resona-deck-recommend-linux-x86_64-${{ github.ref_name }}
          path: resona-deck-recommend-linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git -C sekai-deck-recommend-cpp submodule update --init 3rdparty/json

      - name: Configure Windows build
        run: cmake -S . -B build

      - name: Build Windows release program
        run: cmake --build build --config Release --parallel

      - name: Package Windows release program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/resona-deck-recommend.exe package/
          Copy-Item -Recurse build/Release/data package/
          Compress-Archive -Path package/* -DestinationPath resona-deck-recommend-windows-x86_64-${{ github.ref_name }}.zip

      - name: Upload Windows release program
        uses: actions/upload-artifact@v7
        with:
          name: resona-deck-recommend-windows-x86_64-${{ github.ref_name }}
          path: resona-deck-recommend-windows-x86_64-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git -C sekai-deck-recommend-cpp submodule update --init 3rdparty/json

      - name: Install build dependencies
        run: brew install ninja openssl@3

      - name: Configure macOS build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build macOS release program
        run: cmake --build build --parallel 3

      - name: Package macOS release program
        run: |
          mkdir -p package
          cp build/resona-deck-recommend package/
          cp -R build/data package/
          tar -czf resona-deck-recommend-macos-arm64-${{ github.ref_name }}.tar.gz -C package .

      - name: Upload macOS release program
        uses: actions/upload-artifact@v7
        with:
          name: resona-deck-recommend-macos-arm64-${{ github.ref_name }}
          path: resona-deck-recommend-macos-arm64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read core gitlink
        id: core
        run: echo "ref=$(git rev-parse :sekai-deck-recommend-cpp)" >> "$GITHUB_OUTPUT"

      - name: Download release programs
        uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: resona-deck-recommend-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Downloads

            - **Linux x86_64**: `resona-deck-recommend-linux-x86_64-${{ github.ref_name }}.tar.gz`
            - **Windows x86_64**: `resona-deck-recommend-windows-x86_64-${{ github.ref_name }}.zip`
            - **macOS arm64**: `resona-deck-recommend-macos-arm64-${{ github.ref_name }}.tar.gz`

            ## Native core

            Built against [`Resonalofi/sekai-deck-recommend-cpp@${{ steps.core.outputs.ref }}`](https://github.com/Resonalofi/sekai-deck-recommend-cpp/commit/${{ steps.core.outputs.ref }}).
          files: |
            release-files/resona-deck-recommend-*
            release-files/SHA256SUMS
