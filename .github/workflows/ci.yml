name: Native service CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git submodule update --init sekai-deck-recommend-cpp/3rdparty/json

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package Linux program
        run: |
          mkdir -p package
          cp build/resona-deck-recommend package/
          cp -R build/data package/
          tar -czf resona-deck-recommend-linux-x86_64.tar.gz -C package .

      - name: Upload Linux program
        uses: actions/upload-artifact@v4
        with:
          name: resona-deck-recommend-linux-x86_64
          path: resona-deck-recommend-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git submodule update --init sekai-deck-recommend-cpp/3rdparty/json

      - name: Configure Windows build
        run: cmake -S . -B build

      - name: Build Windows program
        run: cmake --build build --config Release --parallel

      - name: Package Windows program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/resona-deck-recommend.exe package/
          Copy-Item -Recurse build/Release/data package/
          Compress-Archive -Path package/* -DestinationPath resona-deck-recommend-windows-x86_64.zip

      - name: Upload Windows program
        uses: actions/upload-artifact@v4
        with:
          name: resona-deck-recommend-windows-x86_64
          path: resona-deck-recommend-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init nlohmann/json
        shell: bash
        run: git submodule update --init sekai-deck-recommend-cpp/3rdparty/json

      - name: Install build dependencies
        run: brew install ninja openssl@3

      - name: Configure macOS build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build macOS program
        run: cmake --build build --parallel 3

      - name: Package macOS program
        run: |
          mkdir -p package
          cp build/resona-deck-recommend package/
          cp -R build/data package/
          tar -czf resona-deck-recommend-macos-arm64.tar.gz -C package .

      - name: Upload macOS program
        uses: actions/upload-artifact@v4
        with:
          name: resona-deck-recommend-macos-arm64
          path: resona-deck-recommend-macos-arm64.tar.gz
          if-no-files-found: error
