services:
  deck-recommend:
    image: ${RESONA_DECK_IMAGE:-ghcr.io/resonalofi/resona-deck-recommend:latest}
    container_name: resona-deck-recommend
    user: "0:0"
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:23457:23457"
    volumes:
      - ./config.docker.toml:/etc/resona-deck-recommend/config.toml:ro
      - resona-deck-data:/var/lib/resona-deck-recommend
      - /opt/masterdata:/opt/masterdata
      - /opt/resonabot/data:/opt/resonabot/data:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  resona-deck-data:
